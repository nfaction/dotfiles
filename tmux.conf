# Fn Key Bindings
bind-key -n F2 new-window
bind-key -n F3 previous-window
bind-key -n F4 next-window

# Mouse: on by default (wheel scrolls tmux history, click selects pane,
# drag resizes/selects). Toggle with PREFIX m. While on, hold Option
# (iTerm2) / Fn (Terminal.app) / Shift (Ghostty, most others) to do a
# native terminal selection instead.
#
# Scrolling (iTerm2):
#   - Wheel/trackpad up enters copy-mode; [0/N] counter top-right.
#     q or Esc exits. Keyboard: PREFIX [ then PgUp/PgDn/arrows.
#   - Drag selects and copies to the macOS clipboard on release.
#   - Inside vim/less/htop the wheel scrolls the app, not tmux history.
#   - Clients attached before a config change keep old terminal
#     settings; detach and reattach (PREFIX d, tmux a) after reloading.
# If the wheel does nothing:
#   1. PREFIX m until it shows "Mouse: ON".
#   2. iTerm2 Session > Terminal State > Mouse Reporting must be checked
#      (per-tab toggle, easy to switch off by accident).
#   3. iTerm2 Settings > Profiles > Terminal > "Enable mouse reporting"
#      must be on for the profile.
set -g mouse on
bind m set -g mouse \; display 'Mouse: #{?mouse,ON,OFF}'
bind M set -g mouse off \; display 'Mouse: OFF'

# Wheel bindings = tmux 3.x defaults, restated so re-sourcing this file
# clears the old pre-2.1 overrides from a running server.
bind -n WheelUpPane if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -e }
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 5 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 5 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 5 scroll-down
unbind -n WheelDownPane

# Copy-mode selections also land in the macOS clipboard
set -s copy-command 'pbcopy'

# zoom this pane to full screen (built-in equivalent: PREFIX z)
bind + \
    new-window -d -n tmux-zoom 'clear && echo TMUX ZOOM && read' \;\
    swap-pane -s tmux-zoom.0 \;\
    select-window -t tmux-zoom
# restore this pane
bind - \
    last-window \;\
    swap-pane -s tmux-zoom.0 \;\
    kill-window -t tmux-zoom

# Use tmux's own scrollback, not the terminal's (the old smcup@/rmcup@
# override breaks with mouse mode and modern tmux redraws).
set -g terminal-overrides ''

# history scrollback
set-option -g history-limit 50000

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# tmux resurrect (only if installed)
if-shell 'test -f ~/dev/tmux-resurrect/resurrect.tmux' 'run-shell ~/dev/tmux-resurrect/resurrect.tmux'

# tmuxinator
set-window-option -g base-index 1
set-window-option -g pane-base-index 1
